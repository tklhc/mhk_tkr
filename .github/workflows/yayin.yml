# Her push ve PR'da: lint + test + derleme.
# Yalnız main'e push'ta: derlenen dist/ GitHub Pages'e yayınlanır.
# Gerekli ayar (bir kez): Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Kontrol ve yayın

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: derle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
